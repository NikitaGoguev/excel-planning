name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:deps
      - name: Verify tag version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm run verify
      - name: Build and verify clean release
        run: npm run verify:release
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "dist/QuarterPlan-Excel-${GITHUB_REF_NAME}.xlsm"
          "dist/QuarterPlan-Excel-${GITHUB_REF_NAME}-no-macros.xlsx"
          "dist/SHA256SUMS.txt"
          --verify-tag
          --generate-notes
          --title "QuarterPlan Excel ${GITHUB_REF_NAME}"
